<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // SYSTEM_FAILURE</title>
    <style>
        :root {
            --bg-color: #050505;
            --main-cyan: #00f0ff;
            --main-red: #ff003c;
            --text-dark: #4a5568;
            --terminal-green: #00ff41;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* افکت مانیتورهای قدیمی - نویز و خطوط */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* لاگ‌های ترمینال زنده در پس‌زمینه */
        .terminal-logs {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            height: 90vh;
            color: var(--terminal-green);
            font-size: 0.75rem;
            opacity: 0.35;
            z-index: 1;
            overflow: hidden;
            line-height: 1.5;
            text-shadow: 0 0 5px var(--terminal-green);
            pointer-events: none;
        }

        /* المان‌های تزئینی گوشه صفحه */
        .hud-element {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--main-red);
            font-size: 0.7rem;
            text-align: right;
            z-index: 2;
            opacity: 0.7;
            border-right: 2px solid var(--main-red);
            padding-right: 10px;
        }

        /* هسته اصلی محتوا - اضافه شدن هاله تاریک برای خوانایی روی موبایل */
        .core-wrapper {
            position: relative;
            z-index: 20;
            text-align: center;
            width: 100%;
            padding: 40px 15px;
            background: radial-gradient(circle, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.8) 40%, transparent 70%);
        }

        /* افکت گلیچ حرفه‌ای برای 404 */
        .glitch-text {
            font-size: clamp(6rem, 20vw, 15rem);
            font-weight: 900;
            position: relative;
            display: inline-block;
            color: #ffffff;
            letter-spacing: -5px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* تغییر برای جلوگیری از باکس شدن تو موبایل */
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 var(--main-red);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
            background-color: var(--bg-color);
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: -2px 0 var(--main-cyan);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            background-color: var(--bg-color);
        }

        .error-desc {
            font-size: clamp(0.85rem, 2.5vw, 1.2rem);
            color: #a0aec0;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0 10px;
        }

        /* دکمه خط فرمان (Command Line Input) */
        .cmd-btn {
            margin-top: 30px;
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            color: var(--main-cyan);
            border: 1px solid var(--main-cyan);
            padding: 12px 25px;
            font-family: monospace;
            font-size: clamp(0.75rem, 3vw, 1rem);
            text-decoration: none;
            position: relative;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .cmd-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.4), 0 0 20px rgba(0, 240, 255, 0.2);
            text-shadow: 0 0 5px var(--main-cyan);
        }

        /* متن پیش‌فرض دکمه */
        .cmd-btn::before {
            content: "> root@copy-trade:~$ ";
            color: #ffffff;
            opacity: 0.7;
        }

        /* انیمیشن چشمک زن کرسر خط فرمان */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--main-cyan);
            vertical-align: middle;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
        }

        /* تنظیمات اختصاصی موبایل (ریسپانسیو شدن کامل) */
        @media (max-width: 768px) {
            .terminal-logs {
                width: 100%;
                left: 10px;
                top: 10px;
                font-size: 0.65rem;
                opacity: 0.15; /* محوتر شدن در موبایل */
            }
            
            .cmd-btn {
                padding: 10px 15px;
                width: 90%;
                max-width: 320px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* کوتاه کردن عبارت کامند لاین برای جا شدن در موبایل */
            .cmd-btn::before {
                content: "> root:~$ ";
            }

            .hud-element {
                bottom: 10px;
                right: 10px;
                font-size: 0.6rem;
                opacity: 0.3;
            }
        }

        /* کی‌فریم‌های گلیچ */
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="terminal-logs" id="terminal"></div>

    <div class="hud-element">
        SYS_MEM: 0x000000<br>
        POSTGRES_DB: DISCONNECTED<br>
        ROUTER: OFFLINE
    </div>

    <div class="core-wrapper">
        <h1 class="glitch-text" data-text="404">404</h1>
        <div class="error-desc">Fatal Exception: Route Unresolved</div>
        
        <br>
        <a href="/trading/copy-trading/" class="cmd-btn">cd /dashboard/home<span class="cursor"></span></a>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const logs = [
            "WARN: Django router mismatch on port 8000.",
            "ERR: PostgreSQL socket connection timeout.",
            "INFO: Attempting to reconnect to core engine...",
            "ERR: Copy-trading sync sequence failed.",
            "WARN: Matrix calculation node unreachable.",
            "INFO: Flushing corrupted session data.",
            "ERR: Uncaught TypeError in main_thread.",
            "INFO: Terminating inactive PID 4432...",
            "WARN: API rate limit exceeded.",
            "ERR: NoReverseMatch detected in URL config."
        ];

        function addLog() {
            const p = document.createElement('p');
            const randomLog = logs[Math.floor(Math.random() * logs.length)];
            const time = new Date().toISOString().split('T')[1].slice(0, 12);
            p.innerText = `[${time}] ${randomLog}`;
            
            terminal.appendChild(p);

            // نگه داشتن حداکثر 35 خط لاگ برای جلوگیری از سنگین شدن
            if (terminal.childElementCount > 35) {
                terminal.removeChild(terminal.firstChild);
            }

            setTimeout(addLog, Math.random() * 800 + 100);
        }

        addLog();
    </script>
</body>
</html>

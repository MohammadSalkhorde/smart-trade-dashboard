{% extends 'base.html' %}

{% block content %}
<style>
    :root {
        --tg-blue: #0052ff;
        --tg-bg: #f0f2f5;
        --input-bg: #f4f4f7;
    }

    body { background-color: var(--tg-bg); }

    .create-card {
        border: none;
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        background: #ffffff;
        overflow: hidden;
    }

    /* هدر فرم */
    .form-header {
        background: linear-gradient(135deg, #0052ff 0%, #003db3 100%);
        padding: 40px 20px;
        text-align: center;
        color: white;
    }

    .form-header i {
        font-size: 3rem;
        margin-bottom: 10px;
        display: inline-block;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
    }

    .form-body { padding: 40px; }

    /* استایل فیلدها */
    .custom-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: #707579;
        margin-bottom: 8px;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .custom-input {
        background-color: var(--input-bg);
        border: 2px solid transparent;
        border-radius: 15px;
        padding: 15px;
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background-color: #fff;
        border-color: var(--tg-blue);
        box-shadow: 0 0 0 4px rgba(0, 82, 255, 0.1);
        outline: none;
    }

    /* طراحی انتخاب‌گر اولویت (Radio Cards) */
    .urgency-selector {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 25px;
    }

    .urgency-item { position: relative; }

    .urgency-item input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
    }

    .urgency-label {
        display: block;
        text-align: center;
        padding: 12px 5px;
        background: var(--input-bg);
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        color: #555;
        transition: all 0.2s;
    }

    .urgency-item input:checked + .urgency-label {
        background: var(--tg-blue);
        color: white;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 82, 255, 0.3);
    }

    .submit-btn {
        background: var(--tg-blue);
        border: none;
        border-radius: 15px;
        padding: 16px;
        font-weight: 700;
        font-size: 1.1rem;
        color: white;
        width: 100%;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .submit-btn:hover {
        background: #003db3;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 82, 255, 0.2);
    }

    @media (max-width: 768px) {
        .form-body { padding: 25px; }
        .urgency-selector { grid-template-columns: 1fr; }
        .container { padding-top: 20px; }
    }
</style>

<div class="container py-md-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="create-card">
                <div class="form-header">
                    <i class="bi bi-chat-right-dots-fill"></i>
                    <h3 class="fw-bold mb-1">New Conversation</h3>
                    <p class="mb-0 opacity-75 small">Tell us what's on your mind</p>
                </div>

                <div class="form-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="custom-label">Subject</label>
                            <input type="text" name="subject" class="form-control custom-input" 
                                   placeholder="What is this about?" required>
                        </div>

                        <div class="mb-4">
                            <label class="custom-label">Priority Level</label>
                            <div class="urgency-selector">
                                <div class="urgency-item">
                                    <input type="radio" name="urgency" value="low" id="low">
                                    <label for="low" class="urgency-label">Low</label>
                                </div>
                                <div class="urgency-item">
                                    <input type="radio" name="urgency" value="medium" id="medium" checked>
                                    <label for="medium" class="urgency-label">Medium</label>
                                </div>
                                <div class="urgency-item">
                                    <input type="radio" name="urgency" value="high" id="high">
                                    <label for="high" class="urgency-label">High</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="custom-label">Detailed Message</label>
                            <textarea name="message" rows="5" class="form-control custom-input" 
                                      placeholder="Describe your issue here..." required></textarea>
                        </div>

                        <button type="submit" class="submit-btn shadow">
                            Send Message <i class="bi bi-send-fill"></i>
                        </button>

                        <div class="text-center mt-4">
                            <a href="{% url 'accounts:ticket_list' %}" class="text-muted text-decoration-none small">
                                <i class="bi bi-arrow-left me-1"></i> Back to support history
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="mt-4 text-center px-4">
                <div class="d-flex align-items-center justify-content-center gap-3 text-muted" style="font-size: 0.75rem;">
                    <span><i class="bi bi-shield-check me-1"></i> Secure</span>
                    <span>•</span>
                    <span><i class="bi bi-clock-history me-1"></i> ~2h response time</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // انیمیشن کوچک برای انتخاب رادیو باتن‌ها
    document.querySelectorAll('.urgency-label').forEach(label => {
        label.addEventListener('click', () => {
            // ایجاد یک لرزش ملایم هنگام انتخاب (Haptic feedback feel)
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });
    });
</script>
{% endblock %}

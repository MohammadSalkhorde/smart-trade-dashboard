{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm border-0" style="border-radius: 15px;">
            <h3 class="fw-bold text-center mb-4">Login to SmartTrade</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
            </form>
            <p class="mt-3 text-center small text-muted">
                Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

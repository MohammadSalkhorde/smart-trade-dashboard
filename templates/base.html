<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0052ff;
            --bg-light: #ffffff;
            --card-border: #f0f0f0;
            --text-muted: #707a8a;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .navbar { background: white; border-bottom: 1px solid var(--card-border); }
        .trader-card {
            border: 1px solid var(--card-border);
            border-radius: 16px;
            background: white;
            transition: 0.3s;
            overflow: hidden;
        }
        .trader-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        .roi-text { color: #0ecb81; font-weight: bold; font-size: 1.2rem; }
        .btn-copy { background-color: var(--primary-blue); color: white; border-radius: 8px; border: none; padding: 5px 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="#">SmartTrade</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="me-3 text-muted">Balance: <strong>${{ user.balance|default:"0.00" }}</strong></span>
            <div class="rounded-circle bg-light p-2" style="width: 40px; height: 40px;">👤</div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>

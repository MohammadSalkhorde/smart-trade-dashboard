{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4" style="border-radius: 24px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-danger">Withdraw</h4>
                <div class="text-end">
                    <small class="text-muted d-block">Available Balance</small>
                    <span class="fw-bold text-dark">${{ user.balance|floatformat:2 }}</span>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">USDT Amount to Withdraw</label>
                    <div class="input-group">
                        {{ form.amount }}
                        <span class="input-group-text bg-white border-start-0">USDT</span>
                    </div>
                    {% if form.amount.errors %}
                        <div class="text-danger small mt-1">{{ form.amount.errors.0 }}</div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Your Withdrawal Address (TRC20)</label>
                    {{ form.tx_hash }}
                </div>

                <div class="p-3 mb-4 rounded-3" style="background-color: #fff8f8; border: 1px dashed #ffcedb;">
                    <div class="d-flex justify-content-between small">
                        <span class="text-muted">Network Fee</span>
                        <span class="fw-bold text-dark">1.00 USDT</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-3 fw-bold" style="border-radius: 12px;">Confirm & Withdraw</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
